<!doctype html>
<html><head><meta charset="utf-8">
<!-- Play Store feature graphic, 1024x500. Render:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1024,500 \
    --screenshot=play_store/feature_graphic_1024x500.png play_store/feature_graphic_source.html -->
<style>
  @font-face { font-family: Poppins; font-weight: 700; src: url("../assets/fonts/Poppins-Bold.ttf"); }
  @font-face { font-family: Poppins; font-weight: 600; src: url("../assets/fonts/Poppins-SemiBold.ttf"); }
  @font-face { font-family: Inter; src: url("../assets/fonts/Inter.ttf"); }
  html, body { margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden; }
  .card {
    position: relative; width: 1024px; height: 500px; overflow: hidden;
    background:
      radial-gradient(circle at 12% 10%, rgba(255,255,255,.26), rgba(255,255,255,0) 55%),
      linear-gradient(120deg, #E0067F 0%, #8A12B8 55%, #3F1FD1 100%);
    font-family: Inter, sans-serif; color: #fff;
  }
  /* soft nearby rings behind the mark */
  .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.14); }
  .text { position: absolute; left: 72px; top: 0; height: 500px; width: 520px;
          display: flex; flex-direction: column; justify-content: center; }
  h1 { font-family: Poppins; font-weight: 700; font-size: 92px; line-height: 1; margin: 0 0 22px; letter-spacing: -2px; }
  .tag { font-family: Poppins; font-weight: 600; font-size: 34px; line-height: 1.22; margin: 0 0 30px; }
  .pills { display: flex; gap: 12px; flex-wrap: wrap; }
  .pill { font-size: 19px; font-weight: 600; padding: 10px 18px; border-radius: 999px;
          background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); }
  svg { position: absolute; right: 40px; top: 50px; }
</style></head>
<body>
<div class="card">
  <div class="ring" style="width:520px;height:520px;right:-40px;top:-10px"></div>
  <div class="ring" style="width:700px;height:700px;right:-130px;top:-100px"></div>
  <div class="ring" style="width:880px;height:880px;right:-220px;top:-190px"></div>

  <div class="text">
    <h1>TB Chat</h1>
    <p class="tag">Chat with people nearby.<br>No internet needed.</p>
    <div class="pills">
      <span class="pill">Phone to phone</span>
      <span class="pill">Random ID</span>
      <span class="pill">Chats stay on your phone</span>
    </div>
  </div>

  <!-- Same mark as assets/icon/logo_source.html -->
  <svg width="400" height="400" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E0067F"/>
        <stop offset="0.55" stop-color="#8A12B8"/>
        <stop offset="1" stop-color="#3F1FD1"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#2a0a5e" flood-opacity="0.35"/>
      </filter>
    </defs>
    <g transform="translate(-50 12)">
      <path d="M430 250 h330 a96 96 0 0 1 96 96 v170 a96 96 0 0 1 -96 96 h-18 v74 l-86 -74 h-226 a96 96 0 0 1 -96 -96 v-170 a96 96 0 0 1 96 -96 z"
            fill="#ffffff" fill-opacity="0.30"/>
      <g filter="url(#shadow)">
        <path d="M290 360 h380 a110 110 0 0 1 110 110 v190 a110 110 0 0 1 -110 110 h-250 l-118 96 v-96 h-12 a110 110 0 0 1 -110 -110 v-190 a110 110 0 0 1 110 -110 z"
              fill="#ffffff"/>
      </g>
      <text x="482" y="672" text-anchor="middle" font-family="Poppins" font-weight="700"
            font-size="270" letter-spacing="-8" fill="url(#text)">TB</text>
      <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="26">
        <path d="M800 210 a70 70 0 0 1 70 70" stroke-opacity="0.95"/>
        <path d="M800 140 a140 140 0 0 1 140 140" stroke-opacity="0.6"/>
      </g>
      <circle cx="800" cy="280" r="22" fill="#ffffff"/>
    </g>
  </svg>
</div>
</body></html>
