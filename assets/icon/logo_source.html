<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Poppins; font-weight: 700;
    src: url("../fonts/Poppins-Bold.ttf"); }
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style></head>
<body>
<!-- mode via hash: #full (iOS / legacy), #fg (Android adaptive foreground), #bg (Android adaptive background) -->
<svg id="s" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0067F"/>
      <stop offset="0.6" stop-color="#8A12B8"/>
      <stop offset="1" stop-color="#3F1FD1"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0067F"/>
      <stop offset="0.55" stop-color="#8A12B8"/>
      <stop offset="1" stop-color="#3F1FD1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#2a0a5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="bg">
    <rect width="1024" height="1024" fill="url(#brand)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
  </g>

  <!-- Mark, drawn on a 1024 canvas centered at 512,512 -->
  <g id="mark"><g transform="translate(-50 12)">
    <!-- back bubble: the "other phone" -->
    <path d="M430 250 h330 a96 96 0 0 1 96 96 v170 a96 96 0 0 1 -96 96 h-18 v74 l-86 -74 h-226 a96 96 0 0 1 -96 -96 v-170 a96 96 0 0 1 96 -96 z"
          fill="#ffffff" fill-opacity="0.30"/>
    <!-- front bubble -->
    <g filter="url(#shadow)">
      <path d="M290 360 h380 a110 110 0 0 1 110 110 v190 a110 110 0 0 1 -110 110 h-250 l-118 96 v-96 h-12 a110 110 0 0 1 -110 -110 v-190 a110 110 0 0 1 110 -110 z"
            fill="#ffffff"/>
    </g>
    <text x="482" y="672" text-anchor="middle" font-family="Poppins" font-weight="700"
          font-size="270" letter-spacing="-8" fill="url(#text)">TB</text>
    <!-- nearby signal waves -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="26">
      <path d="M800 210 a70 70 0 0 1 70 70" stroke-opacity="0.95"/>
      <path d="M800 140 a140 140 0 0 1 140 140" stroke-opacity="0.6"/>
    </g>
    <circle cx="800" cy="280" r="22" fill="#ffffff"/>
  </g></g>
</svg>
<script>
  const mode = location.hash.slice(1) || 'full';
  const bg = document.getElementById('bg'), mark = document.getElementById('mark');
  if (mode === 'fg') {
    bg.remove();
    // Android adaptive icons keep only the middle 66/108 of the canvas visible on every mask.
    mark.setAttribute('transform', 'translate(512 512) scale(0.66) translate(-512 -512)');
  }
  if (mode === 'bg') mark.remove();
  if (mode === 'full') mark.setAttribute('transform', 'translate(512 512) scale(0.92) translate(-512 -512)');
</script>
</body></html>
